<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a2218" />
      <stop offset="50%" stop-color="#14100c" />
      <stop offset="100%" stop-color="#080705" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8E6510" />
    </linearGradient>

    <linearGradient id="goldCap" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#E1BD53" />
      <stop offset="70%" stop-color="#B88A22" />
      <stop offset="100%" stop-color="#6E4E0A" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C86A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8E6A24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E8C86A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Fragrance Liquid Gradient -->
    <linearGradient id="perfumeLiquid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#92400E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glass Bottle Outer Glow & Stroke -->
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#E5C158" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#996E1E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E5C158" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Luxury Squircle Badge Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#goldBorder)" stroke-width="3.5" />

  <!-- Subtle Radial Amber Glow behind Bottle -->
  <circle cx="256" cy="300" r="140" fill="#E5A328" opacity="0.12" filter="url(#softGlow)" />

  <!-- ================= PERFUME FLACON ================= -->

  <!-- 1. Cap / Stopper -->
  <!-- Cap Pedestal Ring -->
  <rect x="220" y="146" width="72" height="12" rx="3" fill="url(#goldCap)" />

  <!-- Stopper Faceted Gem -->
  <polygon points="214,78 298,78 322,106 322,136 298,146 214,146 190,136 190,106" fill="url(#goldCap)" />
  <!-- Cap Front Facet Highlight -->
  <polygon points="228,86 284,86 304,106 304,130 284,138 228,138 208,130 208,106" fill="url(#goldBright)" opacity="0.45" />
  <line x1="256" y1="78" x2="256" y2="146" stroke="#FFF7D1" stroke-width="2" opacity="0.6" />

  <!-- 2. Sprayer Collar -->
  <rect x="228" y="158" width="56" height="26" rx="4" fill="url(#goldBright)" />
  <rect x="224" y="178" width="64" height="8" rx="2" fill="url(#goldCap)" />

  <!-- 3. Heavy Crystal Glass Bottle Base (Outer Silhouette) -->
  <!-- Outer Chamfered Flacon Shape -->
  <path d="M 216 186
           L 152 216
           Q 134 225 134 246
           L 134 382
           Q 134 424 176 424
           L 336 424
           Q 378 424 378 382
           L 378 246
           Q 378 225 360 216
           L 296 186
           Z"
        fill="#1a1510"
        stroke="url(#glassStroke)"
        stroke-width="7"
        stroke-linejoin="round" />

  <!-- 4. Inner Perfume Liquid Reservoir -->
  <path d="M 220 220
           L 164 242
           Q 156 246 156 256
           L 156 368
           Q 156 394 184 394
           L 328 394
           Q 356 394 356 368
           L 356 256
           Q 356 246 348 242
           L 292 220
           Z"
        fill="url(#perfumeLiquid)" />

  <!-- Meniscus / Liquid Surface Glow -->
  <ellipse cx="256" cy="235" rx="72" ry="7" fill="#FFEBA3" opacity="0.6" />

  <!-- 5. Glass Reflection Highlights -->
  <!-- Left Side Diagonal Reflection -->
  <path d="M 160 258 L 180 258 L 180 376 L 160 376 Z" fill="#ffffff" opacity="0.16" />
  <path d="M 148 250 L 152 250 L 152 384 L 148 384 Z" fill="#ffffff" opacity="0.3" />
  <!-- Bottom Heavy Glass Base Reflection -->
  <path d="M 180 404 L 332 404 Q 354 404 354 396 L 158 396 Q 158 404 180 404 Z" fill="#ffffff" opacity="0.18" />

  <!-- 6. Center Luxury Label Medallion (Motiwala Monogram) -->
  <rect x="206" y="274" width="100" height="74" rx="10" fill="#13100c" stroke="url(#goldBright)" stroke-width="2.5" />
  <rect x="211" y="279" width="90" height="64" rx="7" fill="none" stroke="#C59B27" stroke-width="1" opacity="0.6" />
  <!-- Letter M in Serif / Luxury Styling -->
  <text x="256" y="324"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="44"
        font-weight="700"
        text-anchor="middle"
        fill="url(#goldBright)"
        letter-spacing="1">M</text>

  <!-- 7. Fragrance Sparkle / Radiance Stars -->
  <!-- Big Sparkle Top Right -->
  <g transform="translate(382, 134) scale(0.9)" filter="url(#sparkleGlow)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#goldBright)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
  <!-- Small Sparkle Left -->
  <g transform="translate(122, 186) scale(0.55)" filter="url(#sparkleGlow)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FFE699" />
  </g>
  <!-- Tiny Sparkle Top Center -->
  <g transform="translate(336, 72) scale(0.4)" filter="url(#sparkleGlow)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="#FFE699" />
  </g>
</svg>

